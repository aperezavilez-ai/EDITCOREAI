<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EditCore — Iniciar sesión</title>
<link rel="icon" href="/assets/favicon-32.png" />
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0b0d12; color: #e8eaf0; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
  .card { background: #14171f; border: 1px solid #232733; border-radius: 12px; padding: 32px; width: 360px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #8b909e; font-size: 13px; margin: 0 0 20px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #2b3040; background: #0b0d12; color: #e8eaf0; font-size: 14px; margin-bottom: 12px; }
  .pwd-wrap { position: relative; margin-bottom: 12px; }
  .pwd-wrap input { margin-bottom: 0; padding-right: 40px; }
  .pwd-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; width: auto; padding: 4px; cursor: pointer; font-size: 16px; line-height: 1; }
  button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #5865f2; color: white; font-weight: 600; cursor: pointer; font-size: 14px; }
  button.secondary { background: #2b3040; margin-top: 8px; }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { font-size: 13px; margin-top: 14px; }
  .msg.ok { color: #4ade80; }
  .msg.err { color: #f87171; }
  .back-link { display: inline-block; color: #8b909e; font-size: 13px; text-decoration: none; margin-bottom: 16px; }
  .back-link:hover { color: #e8eaf0; }
  /* OAuth social buttons */
  .ec-auth-social-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .ec-auth-social-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #2b3040; background: #1a1d27;
    color: #e8eaf0; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .ec-auth-social-btn:hover { background: #222535; border-color: #3d4460; }
  .ec-auth-social-btn:disabled { opacity: 0.6; cursor: default; }
  .ec-auth-social-btn svg { flex-shrink: 0; }
  .ec-auth-divider {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; color: #4a5060; font-size: 12px;
  }
  .ec-auth-divider::before, .ec-auth-divider::after {
    content: ""; flex: 1; height: 1px; background: #2b3040;
  }
</style>
</head>
<body>
  <div class="card">
    <a href="/index.html" class="back-link">← Volver a EditCore</a>
    <h1>EditCore</h1>
    <p class="sub">Entra con tu cuenta de Google: es la misma cuenta, saldo y recargas que en la app de escritorio.</p>

    <!-- Social OAuth buttons -->
    <div class="ec-auth-social-row">
      <button type="button" id="loginGoogleBtn" class="ec-auth-social-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#8b909e"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#8b909e"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#8b909e"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#8b909e"/>
        </svg>
        Continuar con Google
      </button>
    </div>
    <p class="sub" style="margin:0;">¿Primera vez? Al entrar con Google se crea tu cuenta automáticamente.</p>
    <div id="msg" class="msg"></div>
  </div>

  <script src="/js/cuentas-config.js"></script>
  <script src="/js/cuentas.js"></script>
  <script>
    const msg = document.getElementById("msg");
    const googleBtn = document.getElementById("loginGoogleBtn");
    const cuentas = window.EditCoreCuentas;

    function showError(text) {
      msg.textContent = text;
      msg.className = "msg err";
    }

    if (!cuentas || !cuentas.isConfigured()) {
      showError("La web no está conectada al servidor de cuentas en este momento. Intenta más tarde o usa la app de escritorio.");
      googleBtn.disabled = true;
    } else if (cuentas.hasSession()) {
      window.location.replace("/app.html");
    }

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      msg.textContent = "Redirigiendo a Google...";
      msg.className = "msg";
      try {
        await cuentas.startGoogleLogin("/app.html");
      } catch (err) {
        showError(err && err.message ? err.message : String(err));
        googleBtn.disabled = false;
      }
    });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
