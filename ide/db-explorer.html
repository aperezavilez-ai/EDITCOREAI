<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EditCoreAI - Explorador de Bases de Datos</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
      --warning: #d29922;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button, select, input {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
    }

    button:hover {
      border-color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      flex: 1;
      min-height: 0;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      padding: 10px;
      overflow: auto;
    }

    .sidebar h2 {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .db-item {
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .db-item:hover {
      background: #1f2937;
    }

    .db-item.active {
      background: #1f2a3a;
      border: 1px solid var(--accent);
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #1f2937;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .main {
      padding: 12px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 13px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .status-item {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }

    .status-item .label {
      font-size: 11px;
      color: var(--muted);
    }

    .status-item .value {
      font-size: 18px;
      font-weight: 700;
      margin-top: 4px;
    }

    .query-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      background: #0d1117;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      resize: vertical;
      min-height: 90px;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .result-table th, .result-table td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }

    .result-table th {
      color: var(--muted);
      font-weight: 600;
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Explorador de Bases de Datos</h1>
    <div class="toolbar">
      <select id="databaseSelect">
        <option value="">Seleccionar base de datos...</option>
      </select>
      <button id="refreshBtn">Actualizar</button>
      <button id="schemaBtn">Ver esquema</button>
    </div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <h2>Bases de datos locales</h2>
      <div id="dbList"></div>

      <h2 style="margin-top:16px;">Conexiones</h2>
      <div id="connectionList"></div>
    </aside>

    <section class="main">
      <div class="card">
        <h3>Estado del servicio</h3>
        <div class="status-grid" id="statusGrid"></div>
      </div>

      <div class="card">
        <h3>Consulta SQL</h3>
        <div class="query-box">
          <textarea id="sqlInput" placeholder="SELECT * FROM sqlite_master LIMIT 20;"></textarea>
          <div class="toolbar">
            <button id="runQueryBtn">Ejecutar consulta</button>
            <span id="queryStatus" class="badge">Listo</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Resultado</h3>
        <div id="resultArea" class="empty">Sin resultados aún.</div>
      </div>
    </section>
  </div>

  <script src="db-explorer.js"></script>
</body>
</html>
